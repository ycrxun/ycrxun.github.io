        giscus:
            repo: ycrxun/ycrxun.github.io
            repoID: MDEwOlJlcG9zaXRvcnk1NjgzMTczMw==
            category: Announcements
            categoryID: DIC_kwDOA2Mu9c4CgXX6
            mapping: title
            reactionsEnabled: 1
            emitMetadata: 1

related:
    includeNewer: true
    threshold: 60
    toLower: false
    indices:
        - name: tags
          weight: 100

        - name: categories
          weight: 200

markup:
    goldmark:
        renderer:
            ## Set to true if you have HTML content inside Markdown
            unsafe: true
